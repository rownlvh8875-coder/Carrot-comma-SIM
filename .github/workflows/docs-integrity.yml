name: Markdown integrity

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/check_markdown_integrity.py'
      - 'tests/test_doc_integrity_check.py'
      - '.github/workflows/docs-integrity.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check_markdown_integrity.py'
      - 'tests/test_doc_integrity_check.py'
      - '.github/workflows/docs-integrity.yml'

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Checker unit tests
        run: python -m unittest tests/test_doc_integrity_check.py -v

      - name: Scan all Markdown files
        run: python scripts/check_markdown_integrity.py --root .

      - name: Public privacy audit
        run: python scripts/public_release_audit.py .
